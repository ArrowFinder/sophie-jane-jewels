<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1200" viewBox="0 0 1000 1200" role="img">
  <defs>
  <linearGradient id="bg-featuregeorgian" gradientTransform="rotate(150)">
    <stop offset="0%" stop-color="#c98a72"/>
    <stop offset="52%" stop-color="#8a2e2f"/>
    <stop offset="100%" stop-color="#4f141b"/>
  </linearGradient>
  <radialGradient id="light-featuregeorgian" cx="30%" cy="22%" r="85%">
    <stop offset="0%" stop-color="#ffffff" stop-opacity="0.55"/>
    <stop offset="55%" stop-color="#ffffff" stop-opacity="0"/>
  </radialGradient>
  <filter id="grain-featuregeorgian">
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
    <feColorMatrix type="saturate" values="0"/>
    <feComponentTransfer><feFuncA type="linear" slope="0.06"/></feComponentTransfer>
    <feComposite operator="over" in2="SourceGraphic"/>
  </filter></defs>
  <rect width="1000" height="1200" fill="url(#bg-featuregeorgian)"/>
  <rect width="1000" height="1200" fill="url(#light-featuregeorgian)"/>
  
    <g stroke="#3a2a20" stroke-opacity="0.5" fill="none" stroke-width="12">
      <ellipse cx="500" cy="720" rx="320" ry="340"/>
      <ellipse cx="500" cy="720" rx="260" ry="280"/>
      <path d="M 360 460 L 500 260 L 640 460 Z"/>
      <circle cx="500" cy="400" r="55"/>
    </g>
  <rect width="1000" height="1200" filter="url(#grain-featuregeorgian)" opacity="0.55"/>
</svg>