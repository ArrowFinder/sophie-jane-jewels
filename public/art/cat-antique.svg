<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1250" viewBox="0 0 1000 1250" role="img">
  <defs>
  <linearGradient id="bg-catantique" gradientTransform="rotate(150)">
    <stop offset="0%" stop-color="#c98a72"/>
    <stop offset="52%" stop-color="#8a2e2f"/>
    <stop offset="100%" stop-color="#4f141b"/>
  </linearGradient>
  <radialGradient id="light-catantique" cx="30%" cy="22%" r="85%">
    <stop offset="0%" stop-color="#ffffff" stop-opacity="0.55"/>
    <stop offset="55%" stop-color="#ffffff" stop-opacity="0"/>
