<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1250" viewBox="0 0 1000 1250" role="img">
  <defs>
  <linearGradient id="bg-catvintage" gradientTransform="rotate(150)">
    <stop offset="0%" stop-color="#efe0c9"/>
    <stop offset="52%" stop-color="#e6c79b"/>
    <stop offset="100%" stop-color="#d79c9d"/>
  </linearGradient>
  <radialGradient id="light-catvintage" cx="30%" cy="22%" r="85%">
    <stop offset="0%" stop-color="#ffffff" stop-opacity="0.55"/>
    <stop offset="55%" stop-color="#ffffff" stop-opacity="0"/>
  </radialGradient>
  <filter id="grain-catvintage">
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
    <feColorMatrix type="saturate" values="0"/>
    <feComponentTransfer><feFuncA type="linear" slope="0.06"/></feComponentTransfer>
    <feComposite operator="over" in2="SourceGraphic"/>
  </filter></defs>
  <rect width="1000" height="1250" fill="url(#bg-catvintage)"/>
  <rect width="1000" height="1250" fill="url(#light-catvintage)"/>
  
    <g stroke="#3a2a20" stroke-opacity="0.5" fill="none" stroke-width="12">
      <path d="M 220 325 Q 500 505 780 325"/>
      <circle cx="500" cy="705" r="200"/>
      <circle cx="500" cy="705" r="100"/>
      <path d="M 500 505 L 500 505"/>
    </g>
  <rect width="1000" height="1250" filter="url(#grain-catvintage)" opacity="0.55"/>
</svg>