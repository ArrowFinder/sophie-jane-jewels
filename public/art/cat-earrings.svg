<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1250" viewBox="0 0 1000 1250" role="img">
  <defs>
  <linearGradient id="bg-catearrings" gradientTransform="rotate(150)">
    <stop offset="0%" stop-color="#f6efe2"/>
    <stop offset="52%" stop-color="#ecdcc2"/>
    <stop offset="100%" stop-color="#d9c3a0"/>
  </linearGradient>
  <radialGradient id="light-catearrings" cx="30%" cy="22%" r="85%">
    <stop offset="0%" stop-color="#ffffff" stop-opacity="0.55"/>
    <stop offset="55%" stop-color="#ffffff" stop-opacity="0"/>
  </radialGradient>
  <filter id="grain-catearrings">
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
    <feColorMatrix type="saturate" values="0"/>
    <feComponentTransfer><feFuncA type="linear" slope="0.06"/></feComponentTransfer>
    <feComposite operator="over" in2="SourceGraphic"/>
  </filter></defs>
  <rect width="1000" height="1250" fill="url(#bg-catearrings)"/>
  <rect width="1000" height="1250" fill="url(#light-catearrings)"/>
  
    <g stroke="#3a2a20" stroke-opacity="0.5" fill="none" stroke-width="12">
      <circle cx="500" cy="405" r="50"/>
      <path d="M 500 455 L 500 605"/>
      <path d="M 320 865 Q 500 565 680 865 Q 500 1045 320 865 Z"/>
    </g>
  <rect width="1000" height="1250" filter="url(#grain-catearrings)" opacity="0.55"/>
</svg>