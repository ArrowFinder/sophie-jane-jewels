<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img">
  <defs>
  <linearGradient id="bg-journal01" gradientTransform="rotate(126)">
    <stop offset="0%" stop-color="#f6efe2"/>
    <stop offset="52%" stop-color="#ecdcc2"/>
    <stop offset="100%" stop-color="#d9c3a0"/>
  </linearGradient>
  <radialGradient id="light-journal01" cx="30%" cy="22%" r="85%">
    <stop offset="0%" stop-color="#ffffff" stop-opacity="0.55"/>
    <stop offset="55%" stop-color="#ffffff" stop-opacity="0"/>
  </radialGradient>
  <filter id="grain-journal01">
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
    <feColorMatrix type="saturate" values="0"/>
    <feComponentTransfer><feFuncA type="linear" slope="0.06"/></feComponentTransfer>
    <feComposite operator="over" in2="SourceGraphic"/>
  </filter></defs>
  <rect width="1200" height="900" fill="url(#bg-journal01)"/>
  <rect width="1200" height="900" fill="url(#light-journal01)"/>
  
  <rect width="1200" height="900" filter="url(#grain-journal01)" opacity="0.55"/>
</svg>