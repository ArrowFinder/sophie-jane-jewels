  <rect width="1200" height="900" fill="url(#bg-editorialvitrine)"/>
  <rect width="1200" height="900" fill="url(#light-editorialvitrine)"/>
  
    <g stroke="#3a2a20" stroke-opacity="0.5" fill="none" stroke-width="10.8">
      <path d="M 348 180 Q 600 342 852 180"/>
      <circle cx="600" cy="522" r="180"/>
