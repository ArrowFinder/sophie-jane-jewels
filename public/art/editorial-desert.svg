<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img">
  <defs>
  <linearGradient id="bg-editorialdesert" gradientTransform="rotate(110)">
    <stop offset="0%" stop-color="#f6efe2"/>
    <stop offset="52%" stop-color="#ecdcc2"/>
    <stop offset="100%" stop-color="#d9c3a0"/>
  </linearGradient>
  <radialGradient id="light-editorialdesert" cx="80%" cy="12%" r="85%">
    <stop offset="0%" stop-color="#ffffff" stop-opacity="0.55"/>
    <stop offset="55%" stop-color="#ffffff" stop-opacity="0"/>
  </radialGradient>
  <filter id="grain-editorialdesert">
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
    <feColorMatrix type="saturate" values="0"/>
    <feComponentTransfer><feFuncA type="linear" slope="0.06"/></feComponentTransfer>
    <feComposite operator="over" in2="SourceGraphic"/>
  </filter></defs>
  <rect width="1600" height="1000" fill="url(#bg-editorialdesert)"/>
  <rect width="1600" height="1000" fill="url(#light-editorialdesert)"/>
  
  <rect width="1600" height="1000" filter="url(#grain-editorialdesert)" opacity="0.55"/>
</svg>