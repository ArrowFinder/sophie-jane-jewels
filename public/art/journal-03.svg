    <stop offset="0%" stop-color="#f4e7c8"/>
    <stop offset="52%" stop-color="#e9c476"/>
    <stop offset="100%" stop-color="#c9a25a"/>
  </linearGradient>
  <radialGradient id="light-journal03" cx="30%" cy="22%" r="85%">
    <stop offset="0%" stop-color="#ffffff" stop-opacity="0.55"/>
