<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1250" viewBox="0 0 1000 1250" role="img">
  <defs>
  <linearGradient id="bg-catrings" gradientTransform="rotate(150)">
    <stop offset="0%" stop-color="#f4e7c8"/>
    <stop offset="52%" stop-color="#e9c476"/>
    <stop offset="100%" stop-color="#c9a25a"/>
  </linearGradient>
  <radialGradient id="light-catrings" cx="30%" cy="22%" r="85%">
    <stop offset="0%" stop-color="#ffffff" stop-opacity="0.55"/>
    <stop offset="55%" stop-color="#ffffff" stop-opacity="0"/>
  </radialGradient>
  <filter id="grain-catrings">
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
    <feColorMatrix type="saturate" values="0"/>
    <feComponentTransfer><feFuncA type="linear" slope="0.06"/></feComponentTransfer>
    <feComposite operator="over" in2="SourceGraphic"/>
  </filter></defs>
  <rect width="1000" height="1250" fill="url(#bg-catrings)"/>
  <rect width="1000" height="1250" fill="url(#light-catrings)"/>
  
    <g stroke="#3a2a20" stroke-opacity="0.5" fill="none" stroke-width="12">
      <ellipse cx="500" cy="745" rx="320" ry="340"/>
      <ellipse cx="500" cy="745" rx="260" ry="280"/>
      <path d="M 360 485 L 500 285 L 640 485 Z"/>
      <circle cx="500" cy="425" r="55"/>
    </g>
  <rect width="1000" height="1250" filter="url(#grain-catrings)" opacity="0.55"/>
</svg>