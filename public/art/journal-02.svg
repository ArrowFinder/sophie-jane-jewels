<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img">
  <defs>
  <linearGradient id="bg-journal02" gradientTransform="rotate(132)">
    <stop offset="0%" stop-color="#f2e3d6"/>
    <stop offset="52%" stop-color="#e7c4c4"/>
    <stop offset="100%" stop-color="#d79c9d"/>
  </linearGradient>
  <radialGradient id="light-journal02" cx="30%" cy="22%" r="85%">
    <stop offset="0%" stop-color="#ffffff" stop-opacity="0.55"/>
    <stop offset="55%" stop-color="#ffffff" stop-opacity="0"/>
  </radialGradient>
  <filter id="grain-journal02">
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
