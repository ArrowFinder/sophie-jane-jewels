<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img">
  <defs>
  <linearGradient id="bg-journal04" gradientTransform="rotate(144)">
    <stop offset="0%" stop-color="#e7e2cf"/>
    <stop offset="52%" stop-color="#cbb98f"/>
    <stop offset="100%" stop-color="#9a8a63"/>
  </linearGradient>
  <radialGradient id="light-journal04" cx="30%" cy="22%" r="85%">
    <stop offset="0%" stop-color="#ffffff" stop-opacity="0.55"/>
    <stop offset="55%" stop-color="#ffffff" stop-opacity="0"/>
  </radialGradient>
  <filter id="grain-journal04">
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
