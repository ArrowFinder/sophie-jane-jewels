<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img">
  <defs>
  <linearGradient id="bg-journal05" gradientTransform="rotate(150)">
    <stop offset="0%" stop-color="#efe0c9"/>
    <stop offset="52%" stop-color="#e6c79b"/>
    <stop offset="100%" stop-color="#d79c9d"/>
  </linearGradient>
  <radialGradient id="light-journal05" cx="30%" cy="22%" r="85%">
    <stop offset="0%" stop-color="#ffffff" stop-opacity="0.55"/>
    <stop offset="55%" stop-color="#ffffff" stop-opacity="0"/>
  </radialGradient>
  <filter id="grain-journal05">
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
    <feColorMatrix type="saturate" values="0"/>
    <feComponentTransfer><feFuncA type="linear" slope="0.06"/></feComponentTransfer>
    <feComposite operator="over" in2="SourceGraphic"/>
  </filter></defs>
  <rect width="1200" height="900" fill="url(#bg-journal05)"/>
  <rect width="1200" height="900" fill="url(#light-journal05)"/>
  
  <rect width="1200" height="900" filter="url(#grain-journal05)" opacity="0.55"/>
</svg>