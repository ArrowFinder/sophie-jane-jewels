<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1400" viewBox="0 0 1100 1400" role="img">
  <defs>
  <linearGradient id="bg-portraitsophie" gradientTransform="rotate(155)">
    <stop offset="0%" stop-color="#efe0c9"/>
    <stop offset="52%" stop-color="#e6c79b"/>
    <stop offset="100%" stop-color="#d79c9d"/>
  </linearGradient>
  <radialGradient id="light-portraitsophie" cx="35%" cy="25%" r="85%">
    <stop offset="0%" stop-color="#ffffff" stop-opacity="0.55"/>
    <stop offset="55%" stop-color="#ffffff" stop-opacity="0"/>
  </radialGradient>
  <filter id="grain-portraitsophie">
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
    <feColorMatrix type="saturate" values="0"/>
    <feComponentTransfer><feFuncA type="linear" slope="0.06"/></feComponentTransfer>
    <feComposite operator="over" in2="SourceGraphic"/>
  </filter></defs>
  <rect width="1100" height="1400" fill="url(#bg-portraitsophie)"/>
  <rect width="1100" height="1400" fill="url(#light-portraitsophie)"/>
  
  <rect width="1100" height="1400" filter="url(#grain-portraitsophie)" opacity="0.55"/>
</svg>